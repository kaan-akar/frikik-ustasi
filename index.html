<script>
'use strict';
// Frikik Ustası: swipe to shoot penalties and free kicks over ten levels.
// The world is 3D (metres; x sideways, y up, z toward the goal; the goal line is z = 0), drawn
// on a 2D canvas through a perspective camera that sits behind the ball.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 720, H = 1280;        // logical size: a phone held upright
const PIXEL = false;
const FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
const TITLE = 'Frikik Ustası';
const CONTROLS = ['Kaydır: şut · kavisli kaydır: falso', 'Masaüstü: oklar nişan, A/D falso, Boşluk güç', 'P: duraklat · M: ses'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function gauss() { return (rng() + rng() + rng() - 1.5) / 0.5; } // about -3..3, roughly normal
const events = []; // window.game.events

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d'); // `let`: the stadium cache borrows it while it draws
let viewScale = 1;
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const r = k * (devicePixelRatio || 1);
  viewScale = k;
  canvas.width = Math.max(1, Math.round(W * r)); canvas.height = Math.max(1, Math.round(H * r)); // never 0: a hidden page has no size yet
  canvas.style.width = Math.round(W * k) + 'px'; canvas.style.height = Math.round(H * k) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * k) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
  bgKey = ''; // the cached stadium is redrawn at the new size
}
addEventListener('resize', fit);
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = 'bold') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function outlined(s, x, y, size, fill, stroke = '#10301a', lw = 6, align = 'center') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---- Input: keys by position, plus the pointer (touch or mouse) ----------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { down.delete(e.code); if (e.code === 'Space') hit.add('SpaceUp'); });
addEventListener('blur', () => down.clear());
const ptrQueue = []; // pointer events, read on the step
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, t: e.timeStamp / 1000 };
}
canvas.addEventListener('pointerdown', e => {
  startAudio(); e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  ptrQueue.push({ kind: 'down', ...toLogical(e) });
});
canvas.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') ptrQueue.push({ kind: 'move', ...toLogical(e) }); });
canvas.addEventListener('pointerup', e => ptrQueue.push({ kind: 'up', ...toLogical(e) }));
canvas.addEventListener('pointercancel', e => ptrQueue.push({ kind: 'up', ...toLogical(e) }));
addEventListener('contextmenu', e => e.preventDefault());

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination);
    const len = ac.sampleRate; const nb = ac.createBuffer(1, len, ac.sampleRate); const d = nb.getChannelData(0);
    let s = 12345; for (let i = 0; i < len; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = s / 0x3fffffff - 1; }
    audio = { ac, out, noise: nb };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slideTo = 0, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
function noise(dur, freq, vol = 0.3, q = 0.8, attack = 0.01, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, src = audio.ac.createBufferSource(), f = audio.ac.createBiquadFilter(), g = audio.ac.createGain();
  src.buffer = audio.noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f).connect(g).connect(audio.out); src.start(t); src.stop(t + dur + 0.05);
}
const sfx = {
  kick(p) { tone(140, 0.18, 'sine', 0.6, 45); noise(0.06, 2500, 0.25 + p * 0.2, 1.2, 0.003); },
  net() { noise(0.45, 1800, 0.35, 0.6, 0.01); },
  cheer() { noise(1.6, 900, 0.22, 0.4, 0.35); noise(1.2, 2600, 0.08, 0.5, 0.3, 0.1); },
  groan() { noise(0.9, 400, 0.18, 0.6, 0.15); },
  post() { tone(880, 0.5, 'triangle', 0.35); tone(1320, 0.35, 'triangle', 0.15); },
  save() { tone(220, 0.12, 'sine', 0.45, 90); noise(0.1, 1200, 0.2, 1, 0.003); },
  whistle() { tone(2100, 0.12, 'square', 0.08); tone(2250, 0.25, 'square', 0.08, 0, 0.14); },
  ring() { tone(988, 0.15, 'triangle', 0.2); tone(1319, 0.3, 'triangle', 0.2, 0, 0.1); },
  click() { tone(660, 0.05, 'square', 0.08); },
  star(i) { tone(660 * Math.pow(1.26, i), 0.25, 'triangle', 0.22); },
};

// ---- Save: stars per level, on this phone -------------------------------------------------
const SAVE_KEY = 'frikik-ustasi-v1';
let save = { stars: new Array(LEVELS.length).fill(0) };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && Array.isArray(s.stars)) save.stars = LEVELS.map((_, i) => s.stars[i] || 0); } catch (_) {}
if (params.get('fresh') === '1' || params.get('manual') === '1') save.stars = new Array(LEVELS.length).fill(0);
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }
function unlocked(i) { return i === 0 || save.stars[i - 1] > 0; }

// ---- The 3D camera ------------------------------------------------------------------------
const GOAL_HW = 3.66, GOAL_H = 2.44, BALL_R = 0.11, NET_D = 2.0, NEAR = 0.25;
const cam = { x: 0, y: 1.9, z: -14, fx: 0, fz: 1, rx: 1, rz: 0, cp: 1, sp: 0, F: 1050, cx: W / 2, cy: H * 0.36 };
function setCamera(bx, bz) {
  let fx = -bx, fz = -bz; const L = Math.hypot(fx, fz) || 1; fx /= L; fz /= L;
  cam.fx = fx; cam.fz = fz; cam.rx = fz; cam.rz = -fx;
  cam.x = bx - fx * tune.cam_back; cam.z = bz - fz * tune.cam_back; cam.y = tune.cam_height;
  const dist = Math.hypot(cam.x, cam.z);
  const pitch = Math.atan2(cam.y - 1.0, dist);
  cam.cp = Math.cos(pitch); cam.sp = Math.sin(pitch);
  cam.F = tune.focal; // fixed, so the ball always sits in the same place at the bottom of the screen
  cam.cx = W / 2; cam.cy = H * 0.40;
  bgKey = '';
}
function toCam(x, y, z) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const x1 = dx * cam.rx + dz * cam.rz, z1 = dx * cam.fx + dz * cam.fz;
  return [x1, dy * cam.cp + z1 * cam.sp, z1 * cam.cp - dy * cam.sp];
}
function projC(c) { if (c[2] < NEAR) return null; const s = cam.F / c[2]; return { x: cam.cx + c[0] * s, y: cam.cy - c[1] * s, s, z: c[2] }; }
function proj(x, y, z) { return projC(toCam(x, y, z)); }
function unproject(sx, sy, planeZ) { // screen point → world point on the plane z = planeZ
  const dxc = (sx - cam.cx) / cam.F, dyc = -(sy - cam.cy) / cam.F; // camera-space ray (dxc, dyc, 1)
  // invert the pitch: y1 = y2·cp − z2·sp, z1 = y2·sp + z2·cp
  const yy = dyc * cam.cp - 1 * cam.sp, zz = dyc * cam.sp + 1 * cam.cp;
  // invert the yaw: world dx = x1·rx + z1·fx, dz = x1·rz + z1·fz
  const wx = dxc * cam.rx + zz * cam.fx, wz = dxc * cam.rz + zz * cam.fz, wy = yy;
  if (Math.abs(wz) < 1e-6) return null;
  const t = (planeZ - cam.z) / wz; if (t <= 0) return null;
  return { x: cam.x + wx * t, y: cam.y + wy * t, z: planeZ };
}
// A world polygon clipped at the near plane, then drawn.
function polyW(pts, fill, stroke, lw) {
  let cs = pts.map(p => toCam(p[0], p[1], p[2]));
  const out = [];
  for (let i = 0; i < cs.length; i++) {
    const a = cs[i], b = cs[(i + 1) % cs.length];
    const ain = a[2] >= NEAR, bin = b[2] >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) { const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]); }
  }
  if (out.length < 3) return;
  ctx.beginPath();
  out.forEach((c, i) => { const p = projC(c); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function lineW(a, b, color, lw) { // a world segment, clipped
  let ca = toCam(...a), cb = toCam(...b);
  if (ca[2] < NEAR && cb[2] < NEAR) return;
  if (ca[2] < NEAR) { const t = (NEAR - ca[2]) / (cb[2] - ca[2]); ca = ca.map((v, i) => v + (cb[i] - v) * t); }
  if (cb[2] < NEAR) { const t = (NEAR - cb[2]) / (ca[2] - cb[2]); cb = cb.map((v, i) => v + (ca[i] - v) * t); }
  const p = projC(ca), q = projC(cb);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
}
function groundLine(x1, z1, x2, z2, w = 0.12, c = '#f4f7ef') {
  const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz) || 1, nx = -dz / L * w / 2, nz = dx / L * w / 2;
  polyW([[x1 + nx, 0.005, z1 + nz], [x2 + nx, 0.005, z2 + nz], [x2 - nx, 0.005, z2 - nz], [x1 - nx, 0.005, z1 - nz]], c);
}

// ---- The stadium, cached per camera ---------------------------------------------------------
const bg = document.createElement('canvas'); const bgx = bg.getContext('2d');
let bgKey = '';
const CROWD = ['#e94b3c', '#f5c542', '#3a7bd5', '#ffffff', '#ff8a3d', '#8e44ad', '#27ae60', '#f06292', '#1abc9c', '#ecf0f1'];
function drawStadium() {
  // sky
  const horizon = cam.cy - cam.F * cam.sp / cam.cp;
  const sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, '#3d8fe0'); sky.addColorStop(1, '#a9dcff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizon + 2);
  // floodlight towers
  for (const sx of [-48, 48]) {
    lineW([sx, 0, 40], [sx, 30, 40], '#5b6470', 6);
    polyW([[sx - 4, 28, 40], [sx + 4, 28, 40], [sx + 4, 33, 40], [sx - 4, 33, 40]], '#e8eef5', '#5b6470', 2);
  }
  // grass
  ctx.fillStyle = '#2f9a48'; ctx.fillRect(0, horizon, W, H - horizon);
  const zFar = 6, zNear = cam.z - 6;
  for (let z = Math.floor(zNear / 4) * 4, i = 0; z < zFar; z += 4, i++) {
    const k = Math.round(z / 4) & 1;
    polyW([[-60, 0, z], [60, 0, z], [60, 0, z + 4], [-60, 0, z + 4]], k ? '#35a852' : '#2c9446');
  }
  // markings
  groundLine(-40, 0, 40, 0);
  groundLine(-20.16, 0, -20.16, -16.5); groundLine(20.16, 0, 20.16, -16.5); groundLine(-20.16, -16.5, 20.16, -16.5);
  groundLine(-9.16, 0, -9.16, -5.5); groundLine(9.16, 0, 9.16, -5.5); groundLine(-9.16, -5.5, 9.16, -5.5);
  polyW(Array.from({ length: 14 }, (_, i) => { const a = i / 14 * Math.PI * 2; return [Math.cos(a) * 0.12, 0.006, -11 + Math.sin(a) * 0.12]; }), '#f4f7ef'); // penalty spot
  { // the arc of the box
    const a0 = Math.acos(5.5 / 9.15); let prev = null;
    for (let i = 0; i <= 24; i++) {
      const a = -a0 + (2 * a0) * i / 24, x = Math.sin(a) * 9.15, z = -11 - Math.cos(a) * 9.15;
      if (prev) groundLine(prev[0], prev[1], x, z, 0.12); prev = [x, z];
    }
  }
  // stands behind the goal: a tiered slope full of fans
  polyW([[-70, 0, 9], [70, 0, 9], [70, 10, 34], [-70, 10, 34]], '#4a5a6e');
  polyW([[-70, 10, 34], [70, 10, 34], [70, 12.5, 34], [-70, 12.5, 34]], '#33404f');
  polyW([[-70, 12.5, 34], [70, 12.5, 34], [70, 13.2, 31], [-70, 13.2, 31]], '#e8eef5'); // roof edge
  let s = 777;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let row = 0; row < 22; row++) {
    const v = (row + 0.5) / 22, y = 0.6 + v * 9.0, z = 10 + v * 23;
    for (let x = -60; x < 60; x += 1.1) {
      const xx = x + (row & 1) * 0.55 + (rnd() - 0.5) * 0.3;
      const p = proj(xx, y, z); if (!p || p.x < -10 || p.x > W + 10) continue;
      const sz = p.s * 0.42;
      ctx.fillStyle = CROWD[(rnd() * CROWD.length) | 0];
      ctx.fillRect(p.x - sz / 2, p.y - sz * 0.2, sz, sz * 0.9);
      ctx.fillStyle = rnd() < 0.5 ? '#f1c59a' : '#b07a52';
      ctx.fillRect(p.x - sz * 0.25, p.y - sz * 0.75, sz * 0.5, sz * 0.5);
    }
  }
  // advertising boards
  const ads = [['#1e5fbf', '#fff', 'FRİKİK'], ['#f5c542', '#1b2a3a', 'GOL TV'], ['#d63c2f', '#fff', 'USTA'], ['#1b2a3a', '#f5c542', 'KÖŞE']];
  for (let i = 0, x = -36; x < 36; x += 8, i++) {
    const [bgc, fg, word] = ads[i % ads.length];
    polyW([[x, 0, 5], [x + 8, 0, 5], [x + 8, 0.9, 5], [x, 0.9, 5]], bgc, '#0d1b2a', 1);
    const p = proj(x + 4, 0.45, 5); if (p) { ctx.save(); ctx.font = `bold ${Math.max(6, p.s * 0.55)}px ${FONT}`; ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(word, p.x, p.y); ctx.restore(); }
  }
  // the net
  const back = [[-GOAL_HW, 0, NET_D], [GOAL_HW, 0, NET_D], [GOAL_HW, 2.0, NET_D], [-GOAL_HW, 2.0, NET_D]];
  polyW(back, 'rgba(255,255,255,0.14)');
  polyW([[-GOAL_HW, GOAL_H, 0], [GOAL_HW, GOAL_H, 0], [GOAL_HW, 2.0, NET_D], [-GOAL_HW, 2.0, NET_D]], 'rgba(255,255,255,0.12)');
  polyW([[-GOAL_HW, 0, 0], [-GOAL_HW, GOAL_H, 0], [-GOAL_HW, 2.0, NET_D], [-GOAL_HW, 0, NET_D]], 'rgba(255,255,255,0.10)');
  polyW([[GOAL_HW, 0, 0], [GOAL_HW, GOAL_H, 0], [GOAL_HW, 2.0, NET_D], [GOAL_HW, 0, NET_D]], 'rgba(255,255,255,0.10)');
  const nc = 'rgba(255,255,255,0.45)';
  for (let x = -GOAL_HW; x <= GOAL_HW + 0.01; x += 0.3) { lineW([x, 0, NET_D], [x, 2.0, NET_D], nc, 1); lineW([x, 2.0, NET_D], [x, GOAL_H, 0], nc, 1); }
  for (let y = 0; y <= 2.0; y += 0.3) lineW([-GOAL_HW, y, NET_D], [GOAL_HW, y, NET_D], nc, 1);
  for (let z = 0; z <= NET_D; z += 0.3) {
    const yt = GOAL_H + (2.0 - GOAL_H) * z / NET_D;
    lineW([-GOAL_HW, yt, z], [GOAL_HW, yt, z], nc, 1);
    lineW([-GOAL_HW, 0, z], [-GOAL_HW, yt, z], nc, 1); lineW([GOAL_HW, 0, z], [GOAL_HW, yt, z], nc, 1);
  }
  for (let y = 0; y <= GOAL_H; y += 0.3) { lineW([-GOAL_HW, y, 0], [-GOAL_HW, Math.min(y, 2.0), NET_D], nc, 1); lineW([GOAL_HW, y, 0], [GOAL_HW, Math.min(y, 2.0), NET_D], nc, 1); }
}
function drawBackground() {
  if (innerWidth > 0 && canvas.width <= 1) fit(); // the page got its size after loading
  const key = [cam.x, cam.z, cam.F, canvas.width].join(',');
  if (key !== bgKey) {
    bg.width = canvas.width; bg.height = canvas.height;
    const r = canvas.width / W, main = ctx;
    bgx.setTransform(r, 0, 0, r, 0, 0);
    ctx = bgx; drawStadium(); ctx = main; // the stadium draws through the same helpers, into the cache
    bgKey = key;
  }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bg, 0, 0); ctx.restore();
}

// ---- Figures, all drawn in code -------------------------------------------------------------
const KIT = {
  red: { shirt: '#d63c2f', shirtDark: '#9e2a20', shorts: '#ffffff', socks: '#d63c2f', num: '#ffffff' },
  keeper: { shirt: '#f5c542', shirtDark: '#c79a22', shorts: '#1b2a3a', socks: '#f5c542', num: '#1b2a3a' },
  blue: { shirt: '#2f6fdc', shirtDark: '#1f4fa6', shorts: '#ffffff', socks: '#2f6fdc', num: '#ffffff' },
};
const SKIN = ['#f1c59a', '#c98e62', '#8d5a3b', '#e7b48c', '#a8714d'];
const HAIR = ['#2b1d14', '#5a3a1e', '#111111', '#c9a15a', '#3b2a1a'];

function drawKeeper(K) {
  const p = proj(K.x, 0, K.z); if (!p) return;
  const lift = Math.max(0, K.y - 1.0);
  ell(p.x, p.y, 0.45 * p.s, 0.12 * p.s, 'rgba(0,0,0,0.28)');
  drawPerson(p.x, p.y, p.s, KIT.keeper, K.mode === 'dive' ? 'dive' : 'keeper', { look: 2, rot: K.mode === 'dive' ? K.rot : K.rot, lift, num: '1' });
}
function drawBallWorld() {
  const S = state, b = S.ball;
  // shadow
  const sp = proj(b.x, 0.01, b.z);
  if (sp) ell(sp.x, sp.y, BALL_R * sp.s * 1.2, BALL_R * sp.s * 0.35, `rgba(0,0,0,${Math.max(0.08, 0.35 - b.y * 0.06)})`);
  // the trail: it bends with the curve
  if (S.trail.length > 1) {
    const col = S.sweet ? '255,214,90' : '255,255,255';
    for (let i = 1; i < S.trail.length; i++) {
      const a = S.trail[i - 1], c = S.trail[i], u = i / S.trail.length;
      const pa = proj(a.x, a.y, a.z), pc = proj(c.x, c.y, c.z); if (!pa || !pc) continue;
      ctx.strokeStyle = `rgba(${col},${0.55 * u})`; ctx.lineWidth = Math.max(1.5, BALL_R * pc.s * 1.1 * u); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pc.x, pc.y); ctx.stroke();
    }
  }
  const p = proj(b.x, b.y, b.z); if (p) drawBall(p.x, p.y, Math.max(3, BALL_R * p.s), b.ang);
}
function drawAimAids() {
  const S = state;
  // the finger's path while swiping, coloured by power
  if (S.swipe && S.swipe.pts.length > 1) {
    const pts = S.swipe.pts, a = pts[0], z = pts[pts.length - 1];
    const dur = Math.max(0.04, z.t - a.t), len = Math.hypot(z.x - a.x, z.y - a.y);
    const power = Math.max(0, Math.min(1, (len / dur - tune.swipe_speed_min) / (tune.swipe_speed_max - tune.swipe_speed_min)));
    const sweet = power >= tune.sweet_lo && power <= tune.sweet_hi;
    ctx.strokeStyle = sweet ? 'rgba(120,255,140,0.85)' : 'rgba(255,255,255,0.7)'; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.stroke();
  }
  // keyboard reticle and power bar (desktop)
  if (S.phase === 'aim' && S.kb.used) {
    const p = proj(S.kb.x, S.kb.y, 0);
    if (p) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, 7); ctx.moveTo(p.x - 26, p.y); ctx.lineTo(p.x - 8, p.y); ctx.moveTo(p.x + 8, p.y); ctx.lineTo(p.x + 26, p.y);
      ctx.moveTo(p.x, p.y - 26); ctx.lineTo(p.x, p.y - 8); ctx.moveTo(p.x, p.y + 8); ctx.lineTo(p.x, p.y + 26); ctx.stroke();
      if (S.kb.curve) { ctx.strokeStyle = '#f5c542'; ctx.beginPath(); ctx.arc(p.x - S.kb.curve * 40, p.y + 40, 44, S.kb.curve > 0 ? -1.2 : Math.PI - 0.2, S.kb.curve > 0 ? 0.2 : Math.PI + 1.2); ctx.stroke(); }
    }
    const bx = 40, by = 980, bw = 34, bh = 220;
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; rrect(bx, by, bw, bh, 10); ctx.fill();
    ctx.fillStyle = 'rgba(120,255,140,0.5)'; ctx.fillRect(bx, by + bh * (1 - tune.sweet_hi), bw, bh * (tune.sweet_hi - tune.sweet_lo));
    if (S.kb.charging) { const ph = S.kb.charge % 2, pw = ph <= 1 ? ph : 2 - ph; ctx.fillStyle = '#f5c542'; ctx.fillRect(bx + 4, by + bh * (1 - pw), bw - 8, bh * pw); }
    outlined('Güç', bx + bw / 2, by - 22, 24, '#ffffff', '#10301a', 5);
    outlined(`Falso ${S.kb.curve > 0 ? 'sağa' : S.kb.curve < 0 ? 'sola' : 'yok'}`, bx, by + bh + 30, 24, '#ffffff', '#10301a', 5, 'left');
  }
  // the teaching hand, before the first shots
  const hint = HINTS[S.level] || ['', ''];
  const line = S.shotNo === 0 ? hint[0] : (S.shotNo === 1 ? hint[1] : '');
  if (S.phase === 'aim' && line) {
    ctx.fillStyle = 'rgba(8,30,16,0.72)'; rrect(40, 790, W - 80, 76, 20); ctx.fill();
    text(line, W / 2, 829, 28, '#ffffff');
  }
  if (S.phase === 'aim' && S.level <= 1 && S.shotNo === 0 && !S.swipe && !S.kb.used) {
    const bs = ballScreen(), u = (S.t * 0.7) % 1;
    const curveX = S.level === 1 ? Math.sin(u * Math.PI) * 60 : 0;
    drawHand(bs.x + 30 + curveX, bs.y + 40 - u * 300, 90);
  }
}
function drawHUD() {
  const S = state, L = S.L;
  ctx.fillStyle = 'rgba(8,30,16,0.72)'; rrect(12, 12, W - 24, 96, 22); ctx.fill();
  buttons.push({ id: 'mute', x: 20, y: 20, w: 80, h: 80 }); drawSpeaker(58, 60, 40, !muted);
  text(`Level ${S.level + 1}`, 120, 42, 30, '#ffffff', 'left');
  text(L.type === 'P' ? 'Penaltı' : `Frikik ${L.d} m`, 120, 80, 24, '#d6f0dc', 'left', 'normal');
  // shots left as little balls, goals against the target
  for (let k = 0; k < tune.shots_per_level; k++) drawBall(330 + k * 44, 44, 16, 0.4 + k);
  for (let k = 0; k < tune.shots_per_level; k++) if (k >= S.shotsLeft) { ctx.fillStyle = 'rgba(8,30,16,0.7)'; ctx.beginPath(); ctx.arc(330 + (tune.shots_per_level - 1 - k) * 44, 44, 17, 0, 7); ctx.fill(); }
  text(`Gol ${S.goals}/${L.need}`, 374, 84, 24, S.goals >= L.need ? '#9dffa8' : '#ffffff');
  if (L.wind) {
    drawFlag(500, 40, 44, L.wind, S.t);
    // the wind arrow: points the way the ball will drift, longer for a stronger wind
    const dir = Math.sign(L.wind), len = 30 + Math.min(1, Math.abs(L.wind) / 3) * 40, ax = 590, ay = 44;
    ctx.strokeStyle = '#ffe2a8'; ctx.fillStyle = '#ffe2a8'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax - dir * len / 2, ay); ctx.lineTo(ax + dir * (len / 2 - 8), ay); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax + dir * len / 2 + dir * 6, ay); ctx.lineTo(ax + dir * (len / 2 - 14), ay - 13); ctx.lineTo(ax + dir * (len / 2 - 14), ay + 13); ctx.closePath(); ctx.fill();
    text(`Rüzgâr ${Math.abs(L.wind).toFixed(1)}`, 580, 84, 22, '#ffe2a8');
  }
  // pause button
  buttons.push({ id: 'pause', x: W - 100, y: 20, w: 80, h: 80 });
  ctx.fillStyle = '#ffffff'; rrect(W - 74, 38, 12, 44, 4); ctx.fill(); rrect(W - 54, 38, 12, 44, 4); ctx.fill();
  // the outcome
  if (S.phase === 'result' && S.outcomeText) {
    const k = Math.min(1, S.phaseT * 5), size = 96 * (0.6 + 0.4 * k);
    outlined(S.outcomeText, W / 2, H * 0.52, size, S.outcome === 'goal' ? '#f5c542' : '#ffffff', '#10301a', 12);
  }
  if (S.flashT > 0) { ctx.globalAlpha = Math.min(1, S.flashT * 2); outlined(S.flash, W / 2, 160, 44, '#9dffa8', '#10301a', 8); ctx.globalAlpha = 1; }
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

fit();
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }

// ---- Install as an app (PWA): only on a real visit, never under a check ----------------------
if ('serviceWorker' in navigator && !CHEAP && params.get('manual') !== '1' && !window.GAME_CLOCK
    && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
